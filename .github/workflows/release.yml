name: Phát hành tri thức

# Chỉ chạy khi người duyệt đẩy tag vX.Y.Z. Launcher kiểm tra tag mới nhất mỗi 24 giờ.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn và các tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kiểm tra trang (lint)
        env:
          SENSITIVE_TERMS: ${{ secrets.SENSITIVE_TERMS }}
        run: |
          # Danh sách thuật ngữ nhạy cảm (mã dự án, tên khách hàng) lấy từ bí mật của repo, dấu phẩy ngăn cách.
          if [ -n "$SENSITIVE_TERMS" ]; then
            printf '%s' "$SENSITIVE_TERMS" | tr ',' '\n' > sensitive-terms.local.txt
          else
            echo "::warning::Chưa đặt bí mật SENSITIVE_TERMS, chỉ quét mẫu chung (email, số điện thoại, đường dẫn máy, khóa)."
          fi
          python tools/lint.py --root .
          rm -f sensitive-terms.local.txt

      - name: Dựng gói phát hành
        run: python tools/build_release.py "$GITHUB_REF_NAME"

      - name: Tạo Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Tri thức $GITHUB_REF_NAME" \
            --notes-file dist/notes.md \
            dist/autocad-knowledge-wiki.zip \
            dist/autocad-knowledge-wiki.zip.sha256
